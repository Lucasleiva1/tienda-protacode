<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#111827" />
    <title>Sin conexión · Prota Admin</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111827;
        color: #eef2f7;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
      }
      main { max-width: 420px; border: 1px solid #2c3a4f; background: #1c2638; padding: 28px; }
      p.eyebrow { margin: 0; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #f0a66b; }
      h1 { margin: 12px 0 8px; font-size: 28px; }
      p { line-height: 1.5; color: #94a3b8; }
      button {
        margin-top: 12px;
        min-height: 48px;
        width: 100%;
        border: 0;
        background: #d47a42;
        color: #111827;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Prota Admin</p>
      <h1>Sin conexión</h1>
      <p>No hay internet en este momento. Los pedidos y pagos se muestran solo con conexión, para no dejar datos privados guardados en el teléfono.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
